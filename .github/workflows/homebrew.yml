name: Homebrew formula

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-formula
  cancel-in-progress: false

jobs:
  formula:
    name: Publish Homebrew formula
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render formula from the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != false ]; then
            echo "Release $TAG is not published" >&2
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
          sh .github/scripts/homebrew-formula.sh "$TAG" checksums.txt > pg-tunnel.rb
      - name: Publish to vertti/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/vertti/homebrew-tap.git" tap
          install -m 644 pg-tunnel.rb tap/Formula/pg-tunnel.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pg-tunnel.rb
          if git diff --cached --quiet; then
            echo "Formula already matches $TAG"
            exit 0
          fi
          git commit -m "pg-tunnel ${TAG#v}"
          git push
