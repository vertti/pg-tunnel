name: Packages

on:
  pull_request:
  workflow_call:
    inputs:
      release:
        description: Build a tagged release with freshly installed tools and no caches.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build archives
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.9.1"
          cache: ${{ !inputs.release }} # Releases use freshly installed tools.
      - if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: package-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: package-
      - name: Check tagged release source
        if: inputs.release
        run: |
          git merge-base --is-ancestor HEAD origin/main
          mise run ci
      - name: Package
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$RELEASE" = true ]; then
            mise x -- goreleaser release --clean --skip=publish
          else
            mise run package
          fi
      - name: Verify Linux packing
        run: mise x -- upx -t dist/pg-tunnel_linux*/pg-tunnel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            dist/*.tar.xz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke test (${{ matrix.platform }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux_amd64
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
          - runner: macos-15
            platform: darwin_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.9.1"
          cache: ${{ !inputs.release }} # Releases use freshly installed tools.
          install_args: go
      - if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: smoke-${{ matrix.platform }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: smoke-${{ matrix.platform }}-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
      - name: Verify and run archive
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          shasum -a 256 -c checksums.txt
          tar -xf "pg-tunnel_${PLATFORM}.tar.xz"
          test -f LICENSE
          test -f licenses/Go/LICENSE
          test -f licenses/github.com/aws/aws-sdk-go-v2/NOTICE.txt
          test -f licenses/github.com/jackc/pgx/v5/LICENSE
          test -f third_party/session-manager-plugin/NOTICE
          test "$(wc -c < pg-tunnel)" -lt 26214400
          ./pg-tunnel --version 2>&1 | grep -F "$EXPECTED_COMMIT"
          ./pg-tunnel --help
          ./pg-tunnel init --help
          printf '%s binary bytes: %s\n' "$PLATFORM" "$(wc -c < pg-tunnel)"
          printf '%s archive bytes: %s\n' "$PLATFORM" "$(wc -c < "pg-tunnel_${PLATFORM}.tar.xz")"
      - name: Verify packaged SSM lifecycle
        run: |
          PG_TUNNEL_TEST_EXECUTABLE="$PWD/pg-tunnel" mise x -- go test -count=1 -v \
            ./internal/awsdb -run '^TestEmbedded(StartupCancellationCleansUp|ShutdownSendsTerminationFlag)$'

  verify:
    name: Release packages
    if: always()
    needs: [package, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: test "$PACKAGE_RESULT" = success && test "$SMOKE_RESULT" = success
