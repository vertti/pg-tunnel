name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    uses: ./.github/workflows/packages.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form.
    with:
      release: ${{ github.ref_type == 'tag' }}

  draft:
    name: Create draft release
    if: github.ref_type == 'tag'
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the draft release and upload verified archives.
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes ./*.tar.xz checksums.txt
