name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    uses: ./.github/workflows/packages.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form.
    with:
      release: ${{ github.ref_type == 'tag' }}

  draft:
    name: Create draft release
    if: github.ref_type == 'tag'
    needs: packages
    runs-on: ubuntu-26.04
    permissions:
      contents: write # Create the draft release and upload verified archives.
      id-token: write # Sign build provenance.
      attestations: write # Publish build provenance.
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.tar.xz"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes ./*.tar.xz checksums.txt
