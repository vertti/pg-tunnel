version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # AWS still requires the pre-v1 API; remove when upstream resolves this:
      # https://github.com/aws/session-manager-plugin/issues/73
      - dependency-name: github.com/twinj/uuid
        versions: ["1.0.0"]
    groups:
      go-modules:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
